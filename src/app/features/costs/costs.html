<div class="page">
  <app-page-header
    [eyebrow]="i18n.t('projectCosts')"
    [title]="i18n.t('costTitle')"
    [subtitle]="i18n.t('costSplit')"
  />

  <section class="grid grid-thirds" [attr.aria-label]="i18n.t('costSplit')">
    <app-kpi-card
      [label]="i18n.t('equipmentSpend')"
      [value]="i18n.formatMoney(totals().equipment)"
      [note]="i18n.t('projectCosts')"
    />
    <app-kpi-card
      [label]="i18n.t('transportSpend')"
      [value]="i18n.formatMoney(totals().transport)"
      [note]="i18n.t('transportation')"
    />
    <app-kpi-card
      [label]="i18n.t('extraSpend')"
      [value]="i18n.formatMoney(totals().extras)"
      [note]="i18n.t('costTitle')"
    />
  </section>

  <app-section-card [eyebrow]="i18n.t('projectCosts')" [title]="i18n.t('costTitle')">
    @if (store.projectCosts().length) {
      <ul class="cost-list">
        @for (line of store.projectCosts(); track line.project) {
          <li class="cost-row">
            <header class="cost-head">
              <strong>{{ i18n.text(line.project) }}</strong>
              <span class="cost-total text-numeric">
                {{ i18n.formatMoney(lineTotal(line.equipment, line.transport, line.extras)) }}
              </span>
            </header>

            <div class="cost-bars">
              <app-meter-bar
                [label]="i18n.t('equipmentSpend')"
                [value]="share(line.equipment, lineTotal(line.equipment, line.transport, line.extras))"
                [valueLabel]="i18n.formatMoney(line.equipment)"
              />
              <app-meter-bar
                [label]="i18n.t('transportSpend')"
                [value]="share(line.transport, lineTotal(line.equipment, line.transport, line.extras))"
                [valueLabel]="i18n.formatMoney(line.transport)"
              />
              <app-meter-bar
                [label]="i18n.t('extraSpend')"
                [value]="share(line.extras, lineTotal(line.equipment, line.transport, line.extras))"
                [valueLabel]="i18n.formatMoney(line.extras)"
              />
            </div>

            <app-meter-bar
              class="cost-progress"
              [label]="i18n.t('costProgress')"
              [value]="line.progress"
              [valueLabel]="i18n.formatPercent(line.progress)"
              [dangerAbove]="90"
            />
          </li>
        }
      </ul>
    } @else {
      <app-empty-state [title]="i18n.t('noRecords')" />
    }
  </app-section-card>
</div>
