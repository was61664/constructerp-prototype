name: Deploy Angular site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Quality gates run BEFORE the build, so a commit that fails any of them
      # never reaches the published site. Previously this workflow built and
      # deployed whatever was pushed to main without checking anything.
      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        # Chrome is preinstalled on ubuntu-latest; naming it explicitly stops
        # karma-chrome-launcher guessing wrong on a runner image update.
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build for GitHub Pages
        run: npm run build -- --base-href /constructerp-prototype/

      # GitHub Pages is a static file server with no rewrite rule, so a deep
      # link like /requests looks for a file that does not exist and serves
      # the 404 page. Pages serves 404.html for any unmatched path, so making
      # it a copy of index.html hands control to the Angular router instead —
      # which is what makes refreshing on a route, or opening a shared link,
      # work at all.
      - name: Serve deep links through the router
        run: cp dist/constructerp-prototype/browser/index.html dist/constructerp-prototype/browser/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/constructerp-prototype/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
